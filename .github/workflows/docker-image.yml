name: Docker Image CI

on:
  push:
    branches: [ "master-amper" ]
  pull_request:
    branches: [ "master-amper" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)